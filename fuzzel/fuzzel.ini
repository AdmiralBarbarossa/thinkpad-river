[main]
font=JetBrainsMono Nerd Font:size=6
dpi-aware=yes
width=25
lines=5 
horizontal-pad=8
vertical-pad=8
inner-pad=5
gamma-correct=yes

terminal=foot
icons-enabled=no
prompt=""
placeholder=""

[colors]
# OLED Black
background=000000ff
# Soft White
text=dcdcdcff

# True ThinkPad Red accent that matches hyprlock
match=b9162aff
selection=222222ff
selection-text=ffffffff
selection-match=b9162aff

# A very subtle border
border=222222ff

[border]
width=2
radius=0   # Changed to 0 for sharp corners
