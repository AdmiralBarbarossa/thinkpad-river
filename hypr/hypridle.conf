general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || (hyprlock & sleep 2)
    after_sleep_cmd = bash -c 'sleep 2; for i in 1 2 3 4 5; do wlr-randr --output eDP-1 --on --scale 1.25 --mode 2880x1800@120.000 2>/dev/null && break; sleep 1; done; sleep 1; pkill -USR1 hyprlock'
}

listener {
    timeout = 60
    on-timeout = brightnessctl -s set 2
    on-resume = brightnessctl -r
}

listener {
    timeout = 120
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 180
    on-timeout = wlr-randr --output eDP-1 --off
    on-resume = bash -c 'for i in 1 2 3; do wlr-randr --output eDP-1 --on --scale 1.25 --mode 2880x1800@120.000 2>/dev/null && break; sleep 1; done; sleep 1; pkill -USR1 hyprlock'
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}