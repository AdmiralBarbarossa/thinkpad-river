general {
    fade_in = 0
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

input-field {
    monitor =
    size = 220, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(185, 22, 42)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(224, 224, 224)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text =
    hide_input = false
    rounding = 0
    check_color = rgb(128, 128, 128)
    fail_color = rgb(185, 22, 42)
    fail_text =
    fail_transition = 300
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(224, 224, 224, 1.0)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}